; PlatformIO project config for the DIY Fingerbot (ESP32)
; Docs: https://docs.platformio.org/en/latest/projectconf/index.html
;
; Three environments. Two flash firmware to the ESP32, one per phase; the third
; runs logic tests on this PC with no hardware attached.
;
;   pio run  -e phase1_autopress -t upload   ; servo only, presses every 3s
;   pio run  -e phase1b_button   -t upload   ; servo + pushbutton trigger
;   pio test -e native                       ; debounce unit tests, no ESP32
;
; Each firmware env compiles exactly ONE source file, so both can live in src/
; without their setup()/loop() colliding. Phase 1 stays flashable forever as a
; known-good baseline.
;
; In the VS Code PlatformIO toolbar, pick the environment from the env switcher
; at the bottom before hitting Upload.

[platformio]
default_envs = phase1_autopress   ; flash this one first on new hardware

; This project lives inside a OneDrive-synced folder. Build output churns by tens
; of MB per compile, and OneDrive both wastes bandwidth syncing it and can lock
; files mid-build. So keep the whole .pio workspace (build output + libdeps) on
; local disk, outside the synced tree.
workspace_dir = ${sysenv.LOCALAPPDATA}/pio-workspace/fingerbot

; Settings shared by the two ESP32 firmware builds.
; NOTE: this is deliberately NOT a [env] section. [env] applies to every
; environment, which would force board/framework onto the native test env and
; break it. Firmware envs opt in via `extends`.
[esp32_base]
platform = espressif32
board = esp32dev            ; generic ESP32 DevKit — change if your board differs
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo   ; servo control on ESP32
    ; HomeSpan is deliberately NOT here. It is added only to phase3_homekit
    ; below, so that pulling in the HomeKit + WiFi stack cannot change the
    ; Phase 1/1b/1c binaries — those are the known-good hardware baselines.

; Mirrors build output back into .wokwi/<env>/ so the Wokwi VS Code extension
; can find it — it rejects any firmware path outside the workspace, and our
; build workspace lives outside this folder (see workspace_dir above).
extra_scripts = post:scripts/copy_firmware_for_wokwi.py

; Phase 1 — auto-press every 3s. Known-good baseline; leave it working.
[env:phase1_autopress]
extends = esp32_base
build_src_filter = -<*> +<phase1_autopress.cpp>

; Phase 1b — pushbutton trigger with debounce.
[env:phase1b_button]
extends = esp32_base
build_src_filter = -<*> +<phase1b_button.cpp>

; Phase 1c — two-position toggle. Same wiring as 1b; the arm now moves to
; different angles for on and off, and remembers which it last set.
[env:phase1c_toggle]
extends = esp32_base
build_src_filter = -<*> +<phase1c_toggle.cpp>

; Phase 1d — serial calibration console. A TOOL, not part of the product: it
; finds the three angles without a reflash per guess. Same wiring as 1b/1c.
[env:phase1d_calibrate]
extends = esp32_base
build_src_filter = -<*> +<phase1d_calibrate.cpp>

; Phase 3 — Siri / Apple Home. Same wiring as 1b/1c; the button is unused.
; Needs include/secrets.h (gitignored) for the WiFi credentials.
;
; HomeSpan is scoped to THIS env only. Adding it to esp32_base would drag the
; HomeKit + WiFi stack into the Phase 1/1b/1c builds and change the binaries
; that are currently validated on hardware.
[env:phase3_homekit]
extends = esp32_base
build_src_filter = -<*> +<phase3_homekit.cpp>
lib_deps =
    ${esp32_base.lib_deps}
    ; PINNED, and it matters. HomeSpan 2.x hard-#errors unless the arduino-esp32
    ; core is >= 3.3.0. platform = espressif32 @ 7.0.1 ships core 2.0.17, and
    ; getting 3.x means switching to the pioarduino platform fork — which would
    ; rebuild the Phase 1/1b/1c binaries that are validated on hardware.
    ; Pinning one library is far cheaper than re-validating three phases.
    homespan/HomeSpan@^1.9.1
; HomeSpan + WiFi + mDNS overflows the default 1.31 MB app partition.
board_build.partitions = huge_app.csv

; Logic tests, compiled and run on the host PC. Needs a native gcc/g++.
; build_src_filter excludes everything in src/ — those files are Arduino-only and
; won't compile here. The tests exercise include/debounce.h, which is pure C++.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
